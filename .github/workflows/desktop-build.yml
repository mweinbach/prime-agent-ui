name: Desktop builds

on:
  workflow_dispatch:
  push:
    branches: ['release/desktop-v*']
    tags: ['desktop-v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  DO_NOT_TRACK: '1'
  PI_OFFLINE: '1'

jobs:
  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-11-arm
            platform: windows
            arch: arm64
            target: aarch64-pc-windows-msvc
            extension: zip
          - runner: windows-2022
            platform: windows
            arch: x86_64
            target: x86_64-pc-windows-msvc
            extension: zip
          - runner: macos-15
            platform: macos
            arch: arm64
            target: aarch64-apple-darwin
            extension: zip
          - runner: ubuntu-24.04
            platform: linux
            arch: x86_64
            target: x86_64-unknown-linux-gnu
            extension: tar.gz
    env:
      # Use the compiler pinned by the harness release workflow, with a native host toolchain.
      RUSTUP_TOOLCHAIN: 1.98.1-${{ matrix.target }}
      ARTIFACT_NAME: prime-agent-ui-${{ matrix.platform }}-${{ matrix.arch }}
      SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust
        run: |
          rustup toolchain install ${{ env.RUSTUP_TOOLCHAIN }} --profile minimal --no-self-update
          rustc --version --verbose
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libfontconfig-dev libwayland-dev libx11-xcb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libvulkan1
      - name: Select Xcode for macOS packaging
        if: runner.os == 'macOS'
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
        run: |
          xcodebuild -version
          xcrun --sdk macosx --find clang
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
      - name: Prepare the pinned Sparkle SDK
        if: runner.os == 'macOS'
        run: |
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* && "${GITHUB_REF_NAME#desktop-v}" != *-* && -z "$SPARKLE_PUBLIC_ED_KEY" ]]; then
            echo "::error::Enroll the Sparkle signing key with scripts/setup_sparkle.sh before tagging a stable release."
            exit 1
          fi
          scripts/fetch_sparkle.sh "$RUNNER_TEMP/sparkle"
          echo "SPARKLE_SDK=$RUNNER_TEMP/sparkle" >> "$GITHUB_ENV"
      - name: Exercise signed Sparkle feeds with a disposable test identity
        if: runner.os == 'macOS'
        run: python3 -B -m unittest discover -s scripts/tests -p test_sparkle_appcast.py
      - name: Build, package, and smoke-test the archive
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/build_desktop.py --arch ${{ matrix.arch }} --out-dir dist/ci
      - name: Upload tested archive
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/ci/${{ env.ARTIFACT_NAME }}.${{ matrix.extension }}
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish desktop release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Download the tested archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: prime-agent-ui-*
          path: release-assets
          merge-multiple: true
      - name: Prepare stable release signing tools
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME#desktop-v}" == *-* ]]; then exit 0; fi
          scripts/fetch_sparkle.sh "$RUNNER_TEMP/sparkle"
          echo "SPARKLE_SDK=$RUNNER_TEMP/sparkle" >> "$GITHUB_ENV"
      - name: Sign the stable macOS archive and appcast
        if: env.SPARKLE_SDK != ''
        shell: bash
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          python3 -B scripts/sparkle_appcast.py release-assets "$GITHUB_REF_NAME"
      - name: Publish the archives and checksums
        shell: bash
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: |
            [Desktop changes](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md)

            Choose the archive for your operating system and CPU.
            The macOS app is ad-hoc signed and is not notarized. The Windows binaries are unsigned.
            The Linux build targets Ubuntu 24.04 x86_64 and needs a Vulkan-capable desktop.
        run: |
          archives=(
            prime-agent-ui-linux-x86_64.tar.gz
            prime-agent-ui-macos-arm64.zip
            prime-agent-ui-windows-arm64.zip
            prime-agent-ui-windows-x86_64.zip
          )
          if [[ "${GITHUB_REF_NAME#desktop-v}" != *-* ]]; then archives+=(appcast.xml); fi
          shasum -a 256 "${archives[@]}" > SHA256SUMS
          flags=()
          if [[ "${GITHUB_REF_NAME#desktop-v}" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${archives[@]}" SHA256SUMS "${flags[@]}" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --notes "$RELEASE_NOTES"
