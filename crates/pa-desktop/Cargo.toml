[package]
name = "pa-desktop"
version.workspace = true
edition = "2024"
license.workspace = true
description = "Native GPUI desktop app and agentic harness studio for Prime Agent."

[[bin]]
name = "prime-agent-ui"
path = "src/main.rs"

[dependencies]
pa-types = { path = "../../harness/crates/pa-types" }
pa-core = { path = "../../harness/crates/pa-core" }
pa-daemon = { path = "../../harness/crates/pa-daemon" }
pa-telemetry = { path = "../../harness/crates/pa-telemetry" }
gpui = { version = "0.2.2", default-features = false, features = ["font-kit"] }
anyhow = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
pulldown-cmark = { version = "0.13", default-features = false }
unicode-segmentation = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting", "parsing", "local-offset"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "wayland", "x11"] }

[dev-dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true
