[package]
name = "pa-desktop"
version.workspace = true
edition = "2024"
license.workspace = true
description = "Native Rune desktop app and agentic harness studio for Prime Agent."

[[bin]]
name = "prime-agent-ui"
path = "src/main.rs"

[dependencies]
pa-types = { path = "../../harness/crates/pa-types" }
pa-core = { path = "../../harness/crates/pa-core" }
pa-daemon = { path = "../../harness/crates/pa-daemon" }
pa-telemetry = { path = "../../harness/crates/pa-telemetry" }
rune = { git = "https://github.com/anomalyco/rune", rev = "47cb857795c3b1dd5097c15d6161719ae738ddda", default-features = false, features = ["accessibility", "metal-backend", "native-file-dialog"] }
anyhow = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "47cb857795c3b1dd5097c15d6161719ae738ddda", features = ["markdown"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting", "parsing", "local-offset"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
